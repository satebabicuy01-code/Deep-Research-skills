topic: "Hubungan desain shopfront/fasad dengan produktivitas toko ritel"
audience: "Director of Design & Corporate Strategic Direction"
research_date: "2026-09-24"
time_range: "Tanpa batas (literatur 1992-2026), fokus bukti empiris dan pengungkapan perusahaan 2019-2026"
research_questions:
  - "Lewat mekanisme apa desain shopfront/fasad memengaruhi produktivitas toko (penjualan per m2, capture rate, konversi, ticket, throughput)?"
  - "Seberapa besar efeknya menurut bukti yang ada, dan seberapa kuat bukti tersebut?"
  - "Bagaimana mengukur dan memprioritaskan investasi fasad secara disiplin?"
productivity_definition: "Penjualan per m2 = (pejalan lewat x capture rate x konversi x nilai transaksi) / luas; ditambah throughput per jam kerja untuk format pickup"
method:
  - "Tinjauan literatur akademik (retail atmospherics, window display, urban design) dengan verifikasi abstrak/teks sumber"
  - "Studi industri (signage, daylighting) dan pengungkapan perusahaan (program remodel)"
  - "Model funnel produktivitas untuk menerjemahkan efek perilaku ke penjualan per m2 (productivity_model.py)"
items:
  - name: "Window Display"
    category: "Konten fasad"
    description: "Kreativitas dan jenis display jendela (produk vs artistik)"
  - name: "Facade Transparency"
    category: "Arsitektur fasad"
    description: "Tingkat kaca/keterlihatan interior dari luar"
  - name: "Active Frontage and Rhythm"
    category: "Arsitektur fasad / urban"
    description: "Ritme unit & pintu, ceruk, zona tepi (studi Gehl & Gil Lopez)"
  - name: "On-Premise Signage"
    category: "Identitas & visibilitas"
    description: "Papan nama gedung, pylon, sisi bangunan tanpa sign"
  - name: "Facade and Sign Lighting"
    category: "Identitas & visibilitas"
    description: "Pencahayaan fasad dan signage, termasuk jam malam"
  - name: "Daylighting and Glazing"
    category: "Selubung bangunan"
    description: "Cahaya alami (skylight/kaca) dan hubungannya dengan penjualan"
  - name: "Frontage Width and Zone A"
    category: "Geometri & properti"
    description: "Nilai ruang dekat muka toko (zoning/ITZA) dan lebar frontage"
  - name: "Exterior Landscaping"
    category: "Eksterior"
    description: "Vegetasi dan elemen eksterior di depan toko"
  - name: "Interactive Digital Storefront"
    category: "Teknologi fasad"
    description: "Layar/teknologi interaktif di etalase"
  - name: "Full Remodel Programs"
    category: "Program renovasi (termasuk fasad)"
    description: "Program remodel berskala: Target, Dollar General, Starbucks"
  - name: "Service Facade for Omnichannel"
    category: "Fasad fungsional"
    description: "Jendela pickup, loker, jalur kurir di muka toko"
execution:
  batch_size: 1
  items_per_agent: 11
  output_dir: "./results"
  note: "Riset dijalankan inline dalam satu sesi; default dipakai untuk semua konfirmasi AskUserQuestion."
