topic: "Korelasi desain shopfront/format gerai Starbucks China dengan pertumbuhan pendapatan"
audience: "Director of Design & Corporate Strategic Direction"
research_date: "2026-09-24"
time_range: "FY2016 - September 2026 (fokus FY2019 - Q2 FY2026, periode data company-operated yang sebanding)"
research_questions:
  - "Seberapa kuat hubungan antara keputusan desain/format gerai dan pertumbuhan pendapatan Starbucks China?"
  - "Format/desain mana yang terbukti menggerakkan traffic, ticket, atau brand premium?"
  - "Apa implikasinya bagi strategi desain & portofolio format di bawah JV Starbucks-Boyu (2026+)?"
method:
  - "Seri keuangan resmi (10-K, press release kuartalan Starbucks; 20-F Luckin), dikonversi ke RMB dengan kurs FRED"
  - "Analisis korelasi deskriptif & dekomposisi pertumbuhan (jumlah gerai vs produktivitas per gerai)"
  - "Studi kasus per format desain (items di bawah) + tinjauan literatur servicescape/atmospherics"
items:
  - name: "Shanghai Reserve Roastery"
    category: "Flagship imersif"
    description: "Roastery 30.000 sq ft di Shanghai (Des 2017), flagship terbesar saat dibuka"
  - name: "Reserve Stores dan Reserve Bars"
    category: "Premium"
    description: "Jaringan gerai/bar Reserve; 150+ lokasi pada 2018, 800+ gerai Reserve & tematik pada 2026"
  - name: "Heritage Adaptive Reuse Stores"
    category: "Lokalisasi arsitektur"
    description: "Gerai di bangunan bersejarah (mis. Tianjin Riverside 66, Shanghai Xintiandi Shikumen)"
  - name: "ICH Themed Concept Stores"
    category: "Lokalisasi budaya"
    description: "Gerai bertema warisan budaya takbenda (Beijing, Shanghai, Suzhou, Nanjing, Hangzhou 2025)"
  - name: "Core Third Place Coffeehouse"
    category: "Format inti"
    description: "Gerai standar berkursi banyak, model 'menyewakan sofa' yang membangun premium Starbucks China"
  - name: "Starbucks Now Express Format"
    category: "Konvenien/digital"
    description: "Format pickup/dispatch delivery pertama di Beijing (Juli 2019)"
  - name: "County Level and Lower Tier Stores"
    category: "Ekspansi geografis"
    description: "Gerai di kota tier bawah dan kabupaten; ~1.000 pasar county (FY2024) menuju 1.500+"
  - name: "IP Themed Storefront Takeovers"
    category: "Tematik/temporer"
    description: "Dekorasi fasad/interior bertema IP (mis. 38 gerai Harry Potter, Q1 FY2026)"
  - name: "Qian Dian Qian Mian Micro Formats"
    category: "Portofolio format JV"
    description: "Strategi 千店千面 2026: gerai 10 m2, kereta kopi, convenience kantor, rumah sakit, flagship Reserve SKP"
  - name: "Luckin Pickup Store Benchmark"
    category: "Kompetitor"
    description: "Format pickup 20-60 m2 (99,1% gerai Luckin) sebagai pembanding model desain berbasis konvenien"
execution:
  batch_size: 1
  items_per_agent: 10
  output_dir: "./results"
  note: "Riset dijalankan inline dalam satu sesi (non-interaktif); default dipakai untuk semua konfirmasi AskUserQuestion."
